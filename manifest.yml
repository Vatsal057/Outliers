# manifest.yml = inventory of what you built
# Lists every output your submission produces, and which tracks and problem
# statements you addressed. The evaluation pipeline checks this against what is
# actually in the repo (check_manifest.py). Any mismatch becomes a note to the
# jury, so keep this accurate and up to date.

team_name: "REPLACE_WITH_TEAM_NAME"

tracks_addressed:
  - "Data Insights & Visualization"   # keep only the track(s) you actually worked on
  # - "Predictive Analytics"
  # - "Policy & Intervention Design"

problem_statements:
  - "REPLACE_WITH_PROBLEM_STATEMENT_ID_OR_TITLE"

# List every file src/run_all.py writes to outputs/ that you want the jury to see.
# Only list files that actually exist in your repo. The pipeline checks each one.
outputs: []
