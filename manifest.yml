  #   description: "REPLACE: what this file contains"
  # - file: "outputs/figures/dashboard.html"
  #   description: "REPLACE: interactive dashboard, static export"
  # If your track includes a predictive model, also list its evaluation file:
  # - file: "outputs/predictions/predictions.csv"
  #   description: "Predicted scores for the holdout set"
  #   evaluation_file: "outputs/tables/model_metrics.csv"

# Only include this section if you used a dataset beyond what the organizers gave you.
